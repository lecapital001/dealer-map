<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dealer Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />

  <style>
    :root {
      --brand: #8ed9c8;
      --mint: #c7f5eb;
      --mint-2: #eafbf6;
      --ink: #14333a;
      --text: #24464d;
    }

    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 100%; }

    .leaflet-tile-pane {
      opacity: 0.78;
      filter: saturate(0.82) brightness(1.05) contrast(0.96);
    }

    .dealer-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, #f8fffd 0%, var(--mint) 24%, var(--brand) 62%, #58bca5 100%);
      border: 2px solid rgba(255,255,255,0.92);
      box-shadow:
        0 0 0 4px rgba(142,217,200,0.16),
        0 0 18px rgba(142,217,200,0.34);
    }

    .dealer-dot::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: inherit;
      border: 1px solid rgba(142,217,200,0.24);
      opacity: 0.9;
    }

    .leaflet-div-icon.dealer-marker {
      background: transparent;
      border: 0;
    }

    .leaflet-popup-content-wrapper {
      background: rgba(234, 251, 246, 0.84);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 18px 42px rgba(20, 51, 58, 0.22);
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
    }

    .leaflet-popup-tip {
      background: rgba(234, 251, 246, 0.9);
    }

    .leaflet-popup-content {
      margin: 14px 16px;
      min-width: 190px;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .popup strong {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--ink);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .popup div {
      font-size: 13px;
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .popup .meta-label {
      color: #2f8c77;
      font-weight: 800;
      margin-right: 4px;
    }

    .dealer-cluster {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      color: var(--ink);
      font-weight: 900;
      font-size: 13px;
      background: radial-gradient(circle, rgba(248,255,253,0.98) 0%, rgba(199,245,235,0.94) 35%, rgba(142,217,200,0.9) 72%, rgba(88,188,165,0.92) 100%);
      border: 2px solid rgba(255,255,255,0.92);
      box-shadow:
        0 0 0 7px rgba(142,217,200,0.13),
        0 0 22px rgba(142,217,200,0.24);
      animation: clusterPulse 3.2s ease-in-out infinite;
    }

    .dealer-cluster::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: inherit;
      border: 1px solid rgba(142,217,200,0.22);
      opacity: 0.9;
    }

    .dealer-cluster.small { font-size: 12px; }
    .dealer-cluster.medium { font-size: 13px; }
    .dealer-cluster.large { font-size: 14px; }

    @keyframes clusterPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 7px rgba(142,217,200,0.10), 0 0 18px rgba(142,217,200,0.20); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 10px rgba(142,217,200,0.14), 0 0 26px rgba(142,217,200,0.28); }
    }
  </style>
</head>
<body>

<div id="map"></div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
  const map = L.map("map", {
    zoomControl: true
  }).setView([54.5, -3], 6);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png", {
    maxZoom: 19,
    subdomains: "abcd",
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
  }).addTo(map);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png", {
    maxZoom: 19,
    subdomains: "abcd",
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
    pane: "overlayPane"
  }).addTo(map);

  let parentHasControl = false;

  window.parent?.postMessage({ type: "DEALER_MAP_READY" }, "*");

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.type !== "SET_VIEW") return;

    const lat = Number(msg.lat);
    const lng = Number(msg.lng);
    const zoom = Number(msg.zoom);

    if (!Number.isFinite(lat) || !Number.isFinite(lng) || !Number.isFinite(zoom)) return;

    parentHasControl = true;
    map.stop();
    map.setView([lat, lng], zoom, { animate: true });
  });

  function popupHtml(d) {
    return `
      <div class="popup">
        <strong>${d.name || "Dealer"}</strong>
        ${d.address ? `<div>${d.address}</div>` : ""}
        ${d.postcode ? `<div>${d.postcode}</div>` : ""}
        ${d.auditor ? `<div><span class="meta-label">Auditor:</span>${d.auditor}</div>` : ""}
      </div>
    `;
  }

  const dealerMarkerIcon = L.divIcon({
    className: "dealer-marker",
    html: '<div class="dealer-dot"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8],
    popupAnchor: [0, -10]
  });

  const dealerClusters = L.markerClusterGroup({
    maxClusterRadius: 34,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true,
    iconCreateFunction(cluster) {
      const count = cluster.getChildCount();
      let size = 34;
      let variant = "small";

      if (count >= 10) {
        size = 40;
        variant = "medium";
      }
      if (count >= 25) {
        size = 48;
        variant = "large";
      }

      return L.divIcon({
        html: `<div class="dealer-cluster ${variant}">${count}</div>`,
        className: "",
        iconSize: [size, size]
      });
    }
  });

  async function loadDealers() {
    try {
      const res = await fetch("/.netlify/functions/dealers", { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load dealers");

      const data = await res.json();
      const dealers = data.dealers || [];

      if (!dealers.length) {
        console.warn("No dealers returned");
        return;
      }

      const bounds = [];
      dealers.forEach(d => {
        if (!Number.isFinite(d.lat) || !Number.isFinite(d.lng)) return;

        const marker = L.marker([d.lat, d.lng], {
          icon: dealerMarkerIcon
        });
        marker.bindPopup(popupHtml(d));
        dealerClusters.addLayer(marker);
        bounds.push([d.lat, d.lng]);
      });

      map.addLayer(dealerClusters);

      if (!parentHasControl && bounds.length) {
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    } catch (err) {
      console.error("Error loading dealers:", err);
    }
  }

  loadDealers();
</script>

</body>
</html>
