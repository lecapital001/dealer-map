<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dealer Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --brand: #8ed9c8;
      --brand-deep: #2f8f7c;
    }

    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 100%; }
    .leaflet-tile-pane { opacity: 1; filter: none; }
    .popup strong {
      display:block;
      font-size:14px;
      margin-bottom:4px;
    }

    .popup div {
      font-size:13px;
      margin-bottom:2px;
    }

    .leaflet-div-icon.dealer-marker {
      background: transparent;
      border: 0;
    }

    .dealer-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, #f2fffb 0%, #66d3bd 28%, var(--brand-deep) 78%, #1f6658 100%);
      border: 2px solid rgba(255,255,255,0.95);
      box-shadow:
        0 0 0 3px rgba(47,143,124,0.16),
        0 0 10px rgba(31,102,88,0.20);
    }
  </style>
</head>
<body>

<div id="map"></div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<script>
  const map = L.map("map", {
    zoomControl: true
  }).setView([54.5, -3], 6);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom: 20,
    subdomains: "abcd",
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
  }).addTo(map);

  let parentHasControl = false;

  window.parent?.postMessage({ type: "DEALER_MAP_READY" }, "*");

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.type !== "SET_VIEW") return;

    const lat = Number(msg.lat);
    const lng = Number(msg.lng);
    const zoom = Number(msg.zoom);

    if (!Number.isFinite(lat) || !Number.isFinite(lng) || !Number.isFinite(zoom)) return;

    parentHasControl = true;
    map.stop();
    map.setView([lat, lng], zoom, { animate: true });
  });

  function popupHtml(d) {
    return `
      <div class="popup">
        <strong>${d.name || "Dealer"}</strong>
        ${d.address ? `<div>${d.address}</div>` : ""}
        ${d.postcode ? `<div>${d.postcode}</div>` : ""}
        ${d.auditor ? `<div><strong>Auditor:</strong> ${d.auditor}</div>` : ""}
      </div>
    `;
  }

  const dealerMarkerIcon = L.divIcon({
    className: "dealer-marker",
    html: '<div class="dealer-dot"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8],
    popupAnchor: [0, -10]
  });

  async function loadDealers() {
    try {
      const res = await fetch("/.netlify/functions/dealers", { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load dealers");

      const data = await res.json();
      const dealers = data.dealers || [];

      if (!dealers.length) {
        console.warn("No dealers returned");
        return;
      }

      const bounds = [];
      dealers.forEach(d => {
        if (!Number.isFinite(d.lat) || !Number.isFinite(d.lng)) return;

        const marker = L.marker([d.lat, d.lng], {
          icon: dealerMarkerIcon
        }).addTo(map);
        marker.bindPopup(popupHtml(d));
        bounds.push([d.lat, d.lng]);
      });

      if (!parentHasControl && bounds.length) {
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    } catch (err) {
      console.error("Error loading dealers:", err);
    }
  }

  loadDealers();
</script>

</body>
</html>
