<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dealer Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --brand: #8ed9c8;
      --brand-deep: #2f8f7c;
    }

    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 100%; }
    .leaflet-tile-pane { opacity: 1; filter: none; }
    .popup strong {
      display:block;
      font-size:14px;
      margin-bottom:4px;
    }

    .popup div {
      font-size:13px;
      margin-bottom:2px;
    }
    .audit-progress{position:absolute;bottom:28px;left:12px;z-index:800;max-width:calc(100vw - 24px);padding:14px 18px;border:1px solid #badbd0;border-radius:12px;background:#f9fffcf2;color:#153d43;font:14px/1.4 Segoe UI,Arial,sans-serif;box-shadow:0 4px 24px #0002}
    .audit-metrics{display:flex;gap:24px;flex-wrap:wrap}.audit-metrics strong{display:block;font-size:26px;font-variant-numeric:tabular-nums}.audit-progress small{display:block;margin-top:8px;color:#4b6668}
  </style>
</head>
<body>

<div id="map"></div>
<section class="audit-progress" data-audit-dashboard="/.netlify/functions/audits" aria-label="Today's audits">
 <div class="audit-metrics"><div><strong data-audit-value="completed">—</strong>Today’s audits completed</div><div><strong data-audit-value="vehicles">—</strong>Vehicles checked on today’s audits</div><div><strong data-audit-value="scheduled">—</strong>Scheduled today</div></div>
 <small data-audit-note>Connecting to audit reporting…</small>
</section>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<script>
  const map = L.map("map", {
    zoomControl: true
  }).setView([54.5, -3], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  let parentHasControl = false;

  window.parent?.postMessage({ type: "DEALER_MAP_READY" }, "*");

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.type !== "SET_VIEW") return;

    const lat = Number(msg.lat);
    const lng = Number(msg.lng);
    const zoom = Number(msg.zoom);

    if (!Number.isFinite(lat) || !Number.isFinite(lng) || !Number.isFinite(zoom)) return;

    parentHasControl = true;
    map.stop();
    map.setView([lat, lng], zoom, { animate: true });
  });

  function popupHtml(d) {
    const box=document.createElement('div');box.className='popup';
    const name=document.createElement('strong');name.textContent=d.name||'Dealer';box.append(name);
    for(const value of [d.address,d.postcode,d.auditor&&'Auditor: '+d.auditor])if(value){const line=document.createElement('div');line.textContent=value;box.append(line);}
    const audit=window.DealerAuditData?.dealers?.[d.id];
    const line=document.createElement('div');line.textContent=audit?'Audit: '+({completed:'Completed',in_progress:'In progress',not_started:'Not started',awaiting_review:'Awaiting review'}[audit.status]||'Unknown')+' · '+audit.completed+' of today’s audits complete':window.DealerAuditData?'No audit scheduled or completed today':'Audit status unavailable';box.append(line);
    if(audit){const vehicles=document.createElement('div');vehicles.textContent='Vehicles checked on today’s audits: '+(audit.missingVehicleCounts?'Awaiting count':audit.vehiclesCounted);box.append(vehicles);}
    return box;
  }

  const dealerMarkerIcon = L.icon({
    iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
    iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
    iconSize: [20, 33],
    iconAnchor: [10, 33],
    popupAnchor: [1, -28],
    shadowSize: [33, 33]
  });

  const dealerMarkers=new Map();let mapPositioned=false,loading=false;
  async function loadDealers() {
    if(loading)return;loading=true;
    try {
      const res = await fetch("/.netlify/functions/dealers", { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load dealers");

      const data = await res.json();
      const dealers = data.dealers || [];

      if (!dealers.length) {
        console.warn("No dealers returned");
        return;
      }

      const bounds = [],present=new Set();
      dealers.forEach(d => {
        if (!Number.isFinite(d.lat) || !Number.isFinite(d.lng)) return;

        const key=d.id||String(d.dealerId);present.add(key);
        let entry=dealerMarkers.get(key);
        if(!entry){entry={marker:L.marker([d.lat,d.lng],{icon:dealerMarkerIcon}).addTo(map),dealer:d};dealerMarkers.set(key,entry);entry.marker.bindPopup(popupHtml(d));}
        else{entry.dealer=d;const at=entry.marker.getLatLng();if(at.lat!==d.lat||at.lng!==d.lng)entry.marker.setLatLng([d.lat,d.lng]);entry.marker.setPopupContent(popupHtml(d));}
        bounds.push([d.lat, d.lng]);
      });

      for(const [key,entry]of dealerMarkers)if(!present.has(key)){map.removeLayer(entry.marker);dealerMarkers.delete(key);}
      if (!mapPositioned && !parentHasControl && bounds.length) {
        map.fitBounds(bounds, { padding: [40, 40] });mapPositioned=true;
      }
    } catch (err) {
      console.error("Error loading dealers:", err);
    }finally{loading=false;}
  }

  loadDealers();setInterval(()=>{if(!document.hidden)loadDealers();},60000);
  document.addEventListener("dealer-audits-updated",()=>{for(const entry of dealerMarkers.values())entry.marker.setPopupContent(popupHtml(entry.dealer));});
</script>

<script src="audit-progress.js"></script>
</body>
</html>
